name: Web application checks

on:
  push:
    branches: [main, feat/emburide-database-migrations]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependencies and generate lockfile
        run: npm install
      - name: Commit dependency lockfile on the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/emburide-database-migrations'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "package-lock.json";
            const branch = "feat/emburide-database-migrations";
            const content = fs.readFileSync(path, "utf8");
            let existing;
            try {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              existing = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing && !Array.isArray(existing) && Buffer.from(existing.content, "base64").toString("utf8") === content) {
              core.info("package-lock.json is already current.");
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: "chore(deps): commit npm lockfile",
              content: Buffer.from(content, "utf8").toString("base64"),
              ...(existing && !Array.isArray(existing) ? { sha: existing.sha } : {}),
            });
            core.info("Committed package-lock.json to the feature branch.");
      - name: Verify lockfile installation
        run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke and responsive tests
        run: npm run test:e2e
