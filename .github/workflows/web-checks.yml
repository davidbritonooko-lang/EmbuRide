name: Web application checks

on:
  push:
    branches: [main, feat/emburide-database-migrations]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify reproducible dependency installation
        run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke and responsive tests
        run: npm run test:e2e

  database-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start -x studio,inbucket,vector,logflare,edge-runtime
      - name: Rebuild database from committed migrations
        run: supabase db reset
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run database workflow and security smoke tests
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          for test_file in supabase/tests/*.sql; do
            echo "Running ${test_file}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$test_file"
          done
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
