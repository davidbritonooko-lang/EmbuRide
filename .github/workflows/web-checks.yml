name: Web application checks

on:
  push:
    branches: [main, feat/emburide-database-migrations]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify reproducible dependency installation
        run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke and responsive tests
        run: npm run test:e2e
